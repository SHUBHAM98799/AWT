name: CI Pipeline

on:
  push:
    branches:
      - main
      - p12
      - p13
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run automated tests
        run: npm test
      - name: Build production frontend
        run: npm run build
